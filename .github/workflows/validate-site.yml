name: Validate Webgyar Site

on:
  pull_request:
  push:
    branches:
      - ai-ops/webgyar-qa-pipeline

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local links and assets
        run: python scripts/validate_site.py
